description: Generate and upload the vscode VSIX file
name: Upload VSIX
outputs:
  location:
    description: "VSIX location"
    value: ${{ steps.upload-vsix.outputs.location }}
runs:
  using: "composite"
  steps:
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
      with:
        node-version: 24.x
        registry-url: "https://registry.npmjs.org"
        scope: "@openfga"
        always-auth: false
        cache: "npm"
        cache-dependency-path: |
          package-lock.json
          client/package-lock.json
          server/package-lock.json
    - run: npm ci
      shell: bash
    - run: npx vsce package -o openfga-latest.vsix
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
      with:
        name: openfga-latest.vsix
        path: ./openfga-latest.vsix
        if-no-files-found: error
    - id: upload-vsix
      run: echo "location=./openfga-latest.vsix" >> $GITHUB_OUTPUT
      shell: bash
